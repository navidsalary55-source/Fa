name: Build Android APK

on:
  workflow_dispatch:        # دکمه‌ی Run workflow در تب Actions
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"
      VERSION_NAME: "1.1.${{ github.run_number }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version code
        run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 20))" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Bundle fonts and libraries inside the app
        run: node scripts/vendor-assets.mjs

      - name: Create Android project
        run: npx cap add android

      - name: Patch Android project (permissions, app name, version)
        run: |
          node scripts/patch-android.mjs
          node scripts/prepare-android.mjs

      - name: Generate icons and splash screen
        run: npx capacitor-assets generate --android

      - name: Sync web files into Android project
        run: npx cap sync android

      - name: Build release APK (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::secret $v خالی است (README را ببین)"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "unsigned apk: $UNSIGNED"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out khaneyab-release.apk aligned.apk
          "$BT/apksigner" verify --verbose khaneyab-release.apk
          rm -f release.jks aligned.apk
          ls -l khaneyab-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khaneyab-apk
          path: khaneyab-release.apk
          retention-days: 30
